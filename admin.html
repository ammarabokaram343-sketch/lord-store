<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة LORD</title><link rel="stylesheet" href="/styles.css"><style>
body{min-height:100vh}.admin-wrap{max-width:1200px;margin:auto;padding:35px 5vw}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}.admin-top h1{margin:0}.panel{background:#111314;border:1px solid #292a2b;border-radius:16px;padding:22px;margin-bottom:18px}.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#0c0d0e;border:1px solid #292a2b;border-radius:12px;padding:18px}.stat strong{display:block;font:700 34px "Teko";color:#d4af37}.admin-table{width:100%;border-collapse:collapse}.admin-table th,.admin-table td{padding:10px;border-bottom:1px solid #292a2b;text-align:right;font-size:12px;vertical-align:top}.mini{padding:6px 9px;font:inherit;border:1px solid #333;background:#171819;color:#fff;border-radius:7px;cursor:pointer}.danger{color:#ff8c8c}.login{max-width:420px;margin:12vh auto}.login input,.admin-form input,.admin-form select,.admin-form textarea{width:100%;background:#151617;border:1px solid #333;color:#fff;padding:11px;border-radius:8px;font:inherit;margin:5px 0 13px}.admin-form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.admin-form .wide{grid-column:1/-1}.product-thumb{width:55px;height:45px;object-fit:cover;border-radius:6px;background:#222}.hidden{display:none}@media(max-width:700px){.stats-grid,.admin-form{grid-template-columns:1fr}.admin-table{display:block;overflow:auto;white-space:nowrap}}
</style></head><body>
<header class="header"><a class="brand" href="/"><img src="/logo.png" alt="LORD"></a><div><button class="ghost-btn" id="logout">تسجيل الخروج</button></div></header>
<div id="login" class="login panel"><span class="kicker">LORD ADMIN</span><h2>لوحة التحكم</h2><label>اسم المستخدم<input id="user" value="admin"></label><label>كلمة المرور<input id="pass" type="password" placeholder="كلمة المرور الافتراضية: LORD@2026"></label><button class="primary-btn full" id="loginBtn">دخول</button><p id="loginErr" class="note"></p></div>
<main id="app" class="admin-wrap hidden">
<div class="admin-top"><div><span class="kicker">CONTROL CENTER</span><h1>إدارة متجر اللورد</h1></div><button class="primary-btn" id="newProduct">+ منتج جديد</button></div>
<div class="stats-grid"><div class="stat"><span>المنتجات</span><strong id="sProducts">0</strong></div><div class="stat"><span>المتوفرة</span><strong id="sActive">0</strong></div><div class="stat"><span>كل الطلبات</span><strong id="sOrders">0</strong></div><div class="stat"><span>طلبات جديدة</span><strong id="sPending">0</strong></div></div>
<section class="panel"><h2>إعدادات المتجر</h2><div class="admin-form"><label>اسم المتجر<input id="setName"></label><label>الهاتف<input id="setPhone"></label><label>واتساب الدولي<input id="setWa"></label><label>اسم فيسبوك<input id="setFb"></label><label>رقم شام كاش<input id="setSham"></label><label>شريط التوصيل<input id="setDelivery"></label></div><button class="primary-btn" id="saveSettings">حفظ الإعدادات</button></section>
<section class="panel"><h2>المنتجات</h2><div id="productEditor" class="hidden"></div><table class="admin-table"><thead><tr><th>صورة</th><th>المنتج</th><th>الفئة</th><th>السعر</th><th>المخزون</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody id="productsBody"></tbody></table></section>
<section class="panel"><h2>الطلبات</h2><table class="admin-table"><thead><tr><th>الرقم</th><th>العميل</th><th>المنتجات</th><th>المجموع</th><th>الدفع</th><th>الحالة</th></tr></thead><tbody id="ordersBody"></tbody></table></section>
</main>
<script src="/admin.js"></script></body></html>
